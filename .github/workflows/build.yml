name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ps-payload-dev/sdk
          path: sdk

      - name: Set up both SDKs
        working-directory: sdk
        run: |
          sudo apt update
          sudo apt install clang-18 lld-18
          make DESTDIR=${{ runner.tool_cache }}/ps-payload-sdk clean install
          echo PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps4 >> $GITHUB_ENV
          echo PS5_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps5 >> $GITHUB_ENV

      - name: Install PS5 libraries
        run: |
          wget https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          tar xf ps5-payload-dev.tar.gz -C $PS5_PAYLOAD_SDK/target --strip-components=3 opt/ps5-payload-sdk/target/user/homebrew

      - name: Checkout websrv
        uses: actions/checkout@v4

      - name: Fetch dependencies
        run: |
          git clone --depth 1 https://github.com/ps-payload-dev/lib-ptrace.git deps/lib-ptrace
          git clone --depth 1 https://github.com/ps-payload-dev/elfldr.git deps/elfldr
          make -C deps/lib-ptrace PLATFORM=ps5 all
          make -C deps/elfldr PLATFORM=ps5 all

      - name: Build PS5
        run: make PLATFORM=ps5 clean all

      - name: Upload PS5 build
        uses: actions/upload-artifact@v4
        with:
          name: websrv-ps5
          path: |
            build/ps5/websrv-ps5.elf
          if-no-files-found: error
