name: Bug report
description: Report a problem building or using websrv
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include the console, exact steps, and any error output you can provide.
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - PS4
        - PS5
        - Both
        - Not console specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Include the commands or steps that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste error messages or output as text.
      render: shell
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Console firmware
      placeholder: e.g. 9.00
  - type: input
    id: loader
    attributes:
      label: ELF loader or exploit
      description: If the problem happens while running on console.
  - type: input
    id: version
    attributes:
      label: websrv version
      description: Release or output of git rev-parse --short HEAD.
  - type: input
    id: host
    attributes:
      label: Build computer and OS
      placeholder: e.g. Ubuntu 24.04
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for the same problem
          required: true
